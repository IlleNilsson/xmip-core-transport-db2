# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-db2"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-db2"
description = "IBM DB2 transport: one row of a query is one Stream, a send is one INSERT; DRDA over TCP with the user ID and password security mechanism, TLS behind the tls feature. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). DRDA is DSS frames carrying DDM objects, with
# FD:OCA describing the rows.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The estate's encoding primitives: the byte cursor objects and rows are
# read over, hex for a binary column, and the random correlation token.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# SQL: the DB2 dialect — its literals, its binary form, the INSERT a send
# writes and a far end takes apart, and a statement's verb.
sql = { package = "xmip-core-library-sql", git = "https://github.com/IlleNilsson/xmip-core-library-sql", branch = "main" }
# The most a connection is read for (`net::MAX_BODY`), and a server's host
# and default port (`net::authority`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# Optional, and only for `tls`: DRDA over the estate's TLS (ADR-0033), so a
# forwarder on an edge device carries no TLS stack it does not speak.
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main", optional = true }

[features]
# TLS from the first byte, to the server's TLS port.
tls = ["dep:tls", "transport/tls"]

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }
# A certificate for the TLS test, signed by the estate's own provisioning
# (dogfooding: the node's self-signed source, not a third party's).
provision = { package = "xmip-core-provision", git = "https://github.com/IlleNilsson/xmip-core-provision", branch = "main" }
provision_self_signed = { package = "xmip-core-provision-self-signed", git = "https://github.com/IlleNilsson/xmip-core-provision-self-signed", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
